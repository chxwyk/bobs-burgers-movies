[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oxy-movie-ticket-bot"
version = "1.0.0"
description = "Private Discord movie ticket orders with 50% pricing and transcripts"
requires-python = ">=3.12"
dependencies = ["discord.py==2.7.1"]

[project.scripts]
oxy-movies = "movie_bot.discord_app:run"

[tool.setuptools.packages.find]
include = ["movie_bot*"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
